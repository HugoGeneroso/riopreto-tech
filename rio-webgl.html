<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste Rio WebGL — Three.js</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f14}
  canvas{display:block}
</style>
<script type="importmap">
{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ===== Rio WebGL: plano com shader de água fluindo (normal-mapped waves) =====
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0f14, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 26, 60);
camera.lookAt(0, 0, -80);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// uniformes compartilhados
const uniforms = {
  uTime: {value: 0},
  uMouse: {value: new THREE.Vector2(0.5, 0.5)},
  uMouseStrength: {value: 0},
};

// ===== Shader do rio =====
const riverMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uMouse;
    uniform float uMouseStrength;

    // noise 2D barato (value noise)
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
    }
    // fbm 4 oitavas
    float fbm(vec2 p){
      float v = 0.0, a = 0.55;
      for(int i=0;i<4;i++){ v += noise(p)*a; p *= 2.03; a *= 0.5; }
      return v;
    }

    void main(){
      vec2 uv = vUv;
      // espaço do rio: x = fluxo (direita), y = largura
      vec2 p = vec2(uv.x * 6.0 - uTime * 0.55, uv.y * 14.0);

      // distorção de fluxo (domain warp) — meandros
      float warp = fbm(p * vec2(0.6, 1.4) + vec2(0.0, uTime*0.12));
      p.y += (warp - 0.5) * 2.6;

      // interação do mouse: vórtice que deforma a água
      vec2 m = vec2(uMouse.x * 6.0 - uTime * 0.55, uMouse.y * 14.0);
      float md = length(p - m);
      p += normalize(p - m + 0.001) * exp(-md * 0.8) * uMouseStrength * 1.6;

      // correnteza: linhas de fluxo (fbm alongado em x)
      float flow = fbm(p * vec2(0.35, 3.2));
      float flow2 = fbm(p * vec2(0.28, 4.6) + vec2(uTime * 0.22, 0.0));

      // profundidade: bordas mais escuras (leito do rio)
      float edge = smoothstep(0.0, 0.22, uv.y) * smoothstep(1.0, 0.78, uv.y);

      // paleta: azul profundo -> azul claro (cristas)
      vec3 deep = vec3(0.012, 0.05, 0.10);
      vec3 mid  = vec3(0.02, 0.13, 0.26);
      vec3 crest= vec3(0.22, 0.74, 0.97);

      vec3 col = mix(deep, mid, flow);
      // cristas: onde flow2 cruza limiar, brilho de "lâmina d'água"
      float crestMask = smoothstep(0.52, 0.72, flow2) * edge;
      col = mix(col, crest, crestMask * 0.65);

      // brilho especular falso (reflexo de lua/sol difuso)
      float spec = pow(flow2, 6.0) * edge;
      col += crest * spec * 0.35;

      // fade nas bordas do viewport
      float vign = smoothstep(1.02, 0.55, length(uv - 0.5) * 1.4);
      col *= vign;

      gl_FragColor = vec4(col, 1.0);
    }`
});

// plano gigante inclinado (o rio se estende pro horizonte)
const river = new THREE.Mesh(new THREE.PlaneGeometry(220, 600, 1, 1), riverMat);
river.rotation.x = -Math.PI / 2.35;
river.position.set(0, -6, -180);
scene.add(river);

// ===== Partículas: brilhos na água (Points) =====
const N = 600;
const pos = new Float32Array(N * 3);
const seed = new Float32Array(N);
for (let i = 0; i < N; i++) {
  pos[i*3] = (Math.random() - 0.5) * 220;
  pos[i*3+1] = -5.6;
  pos[i*3+2] = -Math.random() * 420 + 40;
  seed[i] = Math.random() * 1000;
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
sparkGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
const sparkMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    attribute float aSeed;
    varying float vTw;
    void main(){
      vec3 p = position;
      // fluem pra frente (direção da câmera) com ondulação
      p.z += mod(uTime * (6.0 + aSeed * 0.02) + aSeed * 40.0, 460.0) - 420.0;
      p.x += sin(uTime * 0.8 + aSeed) * 2.0;
      p.y += sin(uTime * 1.2 + aSeed * 2.0) * 0.4;
      vTw = 0.4 + 0.6 * (0.5 + 0.5 * sin(uTime * (1.5 + fract(aSeed) * 2.0) + aSeed));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (aSeed > 850.0 ? 3.4 : 2.0) * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vTw;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float soft = smoothstep(0.5, 0.0, d);
      vec3 col = mix(vec3(0.22, 0.74, 0.97), vec3(0.91, 0.93, 0.97), step(0.75, vTw));
      gl_FragColor = vec4(col, soft * (0.25 + vTw * 0.5));
    }`
});
const sparks = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparks);

// ===== Interação =====
let targetStrength = 0;
addEventListener('mousemove', e => {
  uniforms.uMouse.value.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  targetStrength = 1;
  clearTimeout(window.__idleT);
  window.__idleT = setTimeout(() => targetStrength = 0, 1200);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta(); // evita salto
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (document.hidden) return;
  uniforms.uTime.value = clock.getElapsedTime();
  uniforms.uMouseStrength.value += (targetStrength - uniforms.uMouseStrength.value) * 0.04;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
