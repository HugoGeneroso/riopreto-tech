<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Background Rio Interativo — conceito</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f14}
  canvas{display:block}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;pointer-events:none;z-index:5}
  .overlay .tag{color:#38bdf8;border:1px solid #38bdf8;border-radius:99px;padding:4px 14px;display:inline-block;width:max-content;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
  .overlay h1{color:#e8eef7;font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;max-width:700px;margin:0 0 16px}
  .overlay h1 em{font-style:normal;color:#38bdf8}
  .overlay p{color:#93a4bc;font-size:1.1rem;max-width:540px;margin:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
</head>
<body>
<div class="overlay">
  <span class="tag">São José do Rio Preto · 100% IA · supervisão humana</span>
  <h1>Sites que fazem seu negócio <em>aparecer</em></h1>
  <p>Mova o mouse — o rio responde.</p>
</div>
<script>
p5.disableFriendlyErrors = true;
// ===== Rio interativo — conceito baseado no logo 3 (Chevron + Rio) =====
// Camadas: (1) rios de fluxo (curl noise) que fluem horizontalmente,
// (2) partículas-brilho carregadas pelo fluxo (como reflexos na água),
// (3) chevron do logo 3 aparece sutil ao parar o mouse (ponto de calmaria).
const PALETTE = {
  bg1: [11, 15, 20],      // #0b0f14
  bg2: [17, 24, 35],      // #111823
  acc: [56, 189, 248],    // #38bdf8
  acc2: [14, 165, 233],   // #0ea5e9
  deep: [3, 105, 161],    // #0369a1
  foam: [232, 238, 247],  // branco espuma
};

let flowLayer;           // trilhas persistentes (rios)
let particles = [];
let t = 0;
let mouse = {x: 0, y: 0, px: 0, py: 0, speed: 0, idle: 0};

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  flowLayer = createGraphics(width, height);
  flowLayer.background(PALETTE.bg1[0], PALETTE.bg1[1], PALETTE.bg1[2]);
  // gradiente vertical sutil no fundo
  flowLayer.noStroke();
  for (let y = 0; y < height; y += 4) {
    const lerpV = y / height;
    flowLayer.fill(
      lerp(PALETTE.bg1[0], PALETTE.bg2[0], lerpV) * 0.9,
      lerp(PALETTE.bg1[1], PALETTE.bg2[1], lerpV) * 0.9,
      lerp(PALETTE.bg1[2], PALETTE.bg2[2], lerpV) * 0.9, 40);
    flowLayer.rect(0, y, width, 4);
  }
  mouse.x = width / 2; mouse.y = height / 2;
  // partículas-brilho
  const N = Math.min(420, floor(width * height / 4200));
  for (let i = 0; i < N; i++) {
    particles.push(new Spark());
  }
  background(PALETTE.bg1[0], PALETTE.bg1[1], PALETTE.bg1[2]);
}

function draw() {
  t += 0.0035;
  // --- fade sutil das trilhas (o rio "renova" a água) ---
  flowLayer.noStroke();
  flowLayer.fill(PALETTE.bg1[0], PALETTE.bg1[1], PALETTE.bg1[2], 8);
  flowLayer.rect(0, 0, width, height);

  // --- campo de fluxo: rios horizontais com curl noise ---
  const steps = 140;
  flowLayer.noFill();
  for (let i = 0; i < steps; i++) {
    const y0 = (i / steps) * height;
    // bandas de rio: mais denso em certas faixas (meandros)
    const band = noise(0.9, y0 * 0.004 + t * 0.7);
    if (band < 0.52) continue;
    let x = (i * 37.7 + t * 260) % (width + 120) - 60;
    let y = y0;
    const spd = 2.6;
    flowLayer.strokeWeight(1.1);
    const hueMix = noise(x * 0.002, y0 * 0.003, t);
    flowLayer.stroke(
      lerp(PALETTE.acc[0], PALETTE.deep[0], hueMix),
      lerp(PALETTE.acc[1], PALETTE.deep[1], hueMix),
      lerp(PALETTE.acc[2], PALETTE.deep[2], hueMix), 26);
    flowLayer.beginShape();
    for (let s = 0; s < 14; s++) {
      const a = flowAngle(x, y) * PI;
      x += Math.cos(a) * spd;
      y += Math.sin(a) * spd * 0.6;
      flowLayer.vertex(x, y);
    }
    flowLayer.endShape();
  }

  // --- repulsão suave ao redor do mouse (o cursor "afasta a água") ---
  const dx = mouse.x - pmouseX, dy = mouse.y - pmouseY;
  mouse.speed = Math.min(30, Math.hypot(dx, dy));
  mouse.idle = mouse.speed < 0.6 ? mouse.idle + 1 : 0;
  mouse.px = mouse.x; mouse.py = mouse.y;

  image(flowLayer, 0, 0);

  // --- partículas-brilho carregadas pelo fluxo ---
  noStroke();
  for (const p of particles) {
    p.update();
    p.display();
  }

  // --- chevron do logo 3: aparece na calmaria (mouse parado 2.5s) ---
  if (mouse.idle > 150) {
    drawChevron(mouse.x, mouse.y);
  }
}

function flowAngle(x, y) {
  // fluxo majoritariamente horizontal (rio) + curl noise + influência do mouse
  const n = noise(x * 0.0016, y * 0.003, t * 1.3);
  let a = n * PI * 0.8 - PI * 0.4 + PI; // ângulo ~horizontais com meandro
  // o mouse cria um vórtice suave (repulsão)
  const dx = x - mouse.x, dy = y - mouse.y;
  const d2 = dx * dx + dy * dy;
  const R = 260;
  if (d2 < R * R) {
    const d = Math.sqrt(d2) + 0.001;
    const f = (1 - d / R) * 1.4;
    const am = Math.atan2(dy, dx);
    // mistura o ângulo do rio com o ângulo radial (empurra pra fora)
    a = a * (1 - f) + am * f;
  }
  return a / PI;
}

class Spark {
  constructor() {
    this.reset(true);
  }
  reset(anywhere) {
    this.x = anywhere ? Math.random() * width : -20;
    this.y = Math.random() * height;
    this.life = 200 + Math.random() * 400;
    this.size = 0.6 + Math.random() * 1.8;
    this.bright = Math.random() < 0.18; // poucos brilham mais
  }
  update() {
    const a = flowAngle(this.x, this.y) * PI;
    const boost = this.bright ? 2.6 : 1.6;
    this.x += Math.cos(a) * boost;
    this.y += Math.sin(a) * boost * 0.55;
    this.life -= 1;
    if (this.x > width + 20 || this.life <= 0) this.reset(false);
  }
  display() {
    const alpha = this.bright ? 90 : 34;
    if (this.bright) {
      fill(PALETTE.foam[0], PALETTE.foam[1], PALETTE.foam[2], alpha);
      ellipse(this.x, this.y, this.size * 2.2);
    } else {
      fill(PALETTE.acc[0], PALETTE.acc[1], PALETTE.acc[2], alpha);
      ellipse(this.x, this.y, this.size);
    }
  }
}

function drawChevron(cx, cy) {
  // chevron do logo 3, sutil, pulsando devagar
  const pulse = (Math.sin(millis() * 0.001) + 1) / 2;
  const s = 46 + pulse * 6;
  noFill();
  stroke(PALETTE.acc[0], PALETTE.acc[1], PALETTE.acc[2], 60 + pulse * 40);
  strokeWeight(7);
  strokeJoin(ROUND);
  strokeCap(ROUND);
  beginShape();
  vertex(cx - s, cy + s * 0.5);
  vertex(cx, cy - s * 0.5);
  vertex(cx + s, cy + s * 0.5);
  endShape();
  // onda do rio sob o chevron
  strokeWeight(4);
  noFill();
  beginShape();
  for (let x = -s; x <= s; x += 6) {
    const yy = cy + s * 1.1 + Math.sin(x * 0.08 + millis() * 0.003) * 5;
    vertex(cx + x, yy);
  }
  endShape();
}

function mouseMoved() { mouse.x = mouseX; mouse.y = mouseY; }
function touchMoved() { mouse.x = touches[0]?.x ?? mouseX; mouse.y = touches[0]?.y ?? mouseY; }
function windowResized() { resizeCanvas(windowWidth, windowHeight); flowLayer = createGraphics(width, height); flowLayer.background(PALETTE.bg1[0], PALETTE.bg1[1], PALETTE.bg1[2]); }
</script>
</body>
</html>
